name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LatticeDBSharp.slnx
      - run: dotnet build LatticeDBSharp.slnx --no-restore --configuration Release
      - run: dotnet test tests/LatticeDBSharp.Tests/LatticeDBSharp.Tests.csproj --no-build --configuration Release
      - run: dotnet format LatticeDBSharp.slnx --verify-no-changes --no-restore

  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/LatticeDBSharp/LatticeDBSharp.csproj
      - run: dotnet pack src/LatticeDBSharp/LatticeDBSharp.csproj --no-restore --configuration Release --output artifacts/packages
      - name: Verify package contents and licensing boundary
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/packages/LatticeDBSharp.*.nupkg)
          if ($packages.Count -ne 1) { throw "Expected one package; found $($packages.Count)." }
          ./eng/Verify-NuGetPackage.ps1 -PackagePath $packages[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
