name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - run: dotnet restore LatticeDbSharp.slnx
      - run: dotnet build LatticeDbSharp.slnx --no-restore --configuration Release
      - run: dotnet test tests/LatticeDbSharp.Tests/LatticeDbSharp.Tests.csproj --no-build --configuration Release
      - run: dotnet format LatticeDbSharp.slnx --verify-no-changes --no-restore

  native-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier linux-x64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build and inspect pinned native library
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier linux-x64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run native compatibility tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/linux-x64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64-evidence
          path: native/staging/linux-x64/
          if-no-files-found: error

  native-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier win-x64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build and inspect pinned native library
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier win-x64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run native compatibility tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/win-x64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-windows-x64-evidence
          path: native/staging/win-x64/
          if-no-files-found: error

  native-osx-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier osx-arm64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build and inspect pinned native library
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier osx-arm64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run native compatibility tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/osx-arm64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-osx-arm64-evidence
          path: native/staging/osx-arm64/
          if-no-files-found: error

  pack:
    needs: [native-linux-x64, native-windows-x64, native-osx-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v6
        with:
          name: native-linux-x64-evidence
          path: native/staging/linux-x64
      - uses: actions/download-artifact@v6
        with:
          name: native-windows-x64-evidence
          path: native/staging/win-x64
      - uses: actions/download-artifact@v6
        with:
          name: native-osx-arm64-evidence
          path: native/staging/osx-arm64
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - run: dotnet restore src/LatticeDbSharp/LatticeDbSharp.csproj
      - run: dotnet pack src/LatticeDbSharp/LatticeDbSharp.csproj --no-restore --configuration Release --output artifacts/packages
      - name: Verify package contents and licensing boundary
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/packages/LatticeDbSharp.*.nupkg)
          if ($packages.Count -ne 1) { throw "Expected one package; found $($packages.Count)." }
          ./eng/Test-NuGetPackageVerifier.ps1 -PackagePath $packages[0].FullName
          ./eng/Test-NuGetConsumer.ps1 -PackagePath $packages[0].FullName
      - uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

  package-smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Smoke-test package on ${{ matrix.os }}
        shell: pwsh
        run: |
          $package = (Get-ChildItem artifacts/packages/LatticeDbSharp.*.nupkg).FullName
          ./eng/Test-NuGetConsumer.ps1 -PackagePath $package
