name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier linux-x64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build verified Linux x64 native asset
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier linux-x64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run Linux x64 native integration tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/linux-x64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64-evidence
          path: native/staging/linux-x64/
          if-no-files-found: error

  native-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier win-x64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build verified Windows x64 native asset
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier win-x64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run Windows x64 native integration tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/win-x64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-windows-x64-evidence
          path: native/staging/win-x64/
          if-no-files-found: error

  native-osx-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote
      - name: Install verified Zig toolchain
        id: zig
        shell: pwsh
        run: |
          $directory = ./eng/Install-Zig.ps1 -RuntimeIdentifier osx-arm64
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Build verified macOS ARM64 native asset
        id: native
        shell: pwsh
        run: |
          $library = ./eng/Build-Native.ps1 `
            -RuntimeIdentifier osx-arm64 `
            -ZigDirectory '${{ steps.zig.outputs.directory }}'
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Run macOS ARM64 native integration tests
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ steps.native.outputs.library }}
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/osx-arm64/abi.json
        run: >-
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj
          --configuration Release
          -p:EnableNativeTests=true
      - uses: actions/upload-artifact@v6
        with:
          name: native-osx-arm64-evidence
          path: native/staging/osx-arm64/
          if-no-files-found: error

  pack:
    needs: [native-linux-x64, native-windows-x64, native-osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v6
        with:
          name: native-windows-x64-evidence
          path: native/staging/win-x64
      - uses: actions/download-artifact@v6
        with:
          name: native-osx-arm64-evidence
          path: native/staging/osx-arm64
      - uses: actions/download-artifact@v6
        with:
          name: native-linux-x64-evidence
          path: native/staging/linux-x64

      - name: Verify pinned upstream contract
        shell: pwsh
        run: ./eng/Verify-UpstreamManifest.ps1 -VerifyRemote

      - name: Build and test
        shell: pwsh
        env:
          LATTICEDBSHARP_NATIVE_LIBRARY: ${{ github.workspace }}/native/staging/linux-x64/liblattice.so
          LATTICEDBSHARP_ABI_MANIFEST: ${{ github.workspace }}/native/staging/linux-x64/abi.json
        run: |
          dotnet build LatticeDbSharp.slnx --configuration Release
          dotnet test tests/LatticeDbSharp.Tests/LatticeDbSharp.Tests.csproj --configuration Release --no-build
          dotnet test tests/LatticeDbSharp.IntegrationTests/LatticeDbSharp.IntegrationTests.csproj --configuration Release -p:EnableNativeTests=true

      - name: Pack
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--property:PackageVersion="${GITHUB_REF_NAME#v}")
          fi
          dotnet pack src/LatticeDbSharp/LatticeDbSharp.csproj \
            --configuration Release \
            --output ./artifacts \
            "${args[@]}"

      - name: Verify package contents and licensing boundary
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/LatticeDbSharp.*.nupkg)
          if ($packages.Count -ne 1) { throw "Expected one package; found $($packages.Count)." }
          ./eng/Test-NuGetPackageVerifier.ps1 -PackagePath $packages[0].FullName

      - uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
          if-no-files-found: error

  package-smoke-linux:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts
      - name: Smoke-test package on Linux x64
        shell: pwsh
        run: |
          $package = (Get-ChildItem artifacts/LatticeDbSharp.*.nupkg).FullName
          ./eng/Test-NuGetConsumer.ps1 -PackagePath $package

  package-smoke-windows:
    needs: pack
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts
      - name: Smoke-test package on Windows x64
        shell: pwsh
        run: |
          $package = (Get-ChildItem artifacts/LatticeDbSharp.*.nupkg).FullName
          ./eng/Test-NuGetConsumer.ps1 -PackagePath $package

  package-smoke-osx:
    needs: pack
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts
      - name: Smoke-test package on macOS ARM64
        shell: pwsh
        run: |
          $package = (Get-ChildItem artifacts/LatticeDbSharp.*.nupkg).FullName
          ./eng/Test-NuGetConsumer.ps1 -PackagePath $package

  publish:
    needs: [pack, package-smoke-linux, package-smoke-windows, package-smoke-osx]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
      - name: Push symbols
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
